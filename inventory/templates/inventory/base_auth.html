{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/flux_design_system.css' %}">
    <title>Flux | {% block title %}{% endblock %}</title>
    <style>
        @import url('https://fonts.googleapis.com/css?family=Poppins:400,500,600,700&display=swap');
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-size: cover;
        }
        .box {
            position: relative;
            max-width: 430px;
            width: 100%;
            background: #fff;
            padding: 34px;
            border-radius: 6px;
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.2);
            margin: 20px;
        }
        footer {
            position: fixed;
            bottom: 0;
            width: 100%;
            text-align: center;
            padding: 10px;
            /* background: #f8f9fa; */
        }
    </style>
    {% block extra_css %}{% endblock %}
    <script src="{% static 'js/flux_preferences.js' %}" defer></script>
    <style>
        body.flux-auth {
            min-height: 100vh;
            padding: 1.5rem 1rem 4.5rem;
            background-color: #e9edf4;
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            background-attachment: fixed;
            color: #1d1d1f;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .flux-auth .box {
            width: min(100%, 440px);
            padding: clamp(1.5rem, 5vw, 2.5rem);
            border: 1px solid rgb(255 255 255 / 0.85);
            border-radius: 1.25rem;
            box-shadow: 0 24px 70px rgb(20 30 50 / 0.12);
        }

        .flux-auth input,
        .flux-auth select,
        .flux-auth textarea {
            max-width: 100%;
        }

        .flux-auth input:focus-visible,
        .flux-auth select:focus-visible,
        .flux-auth textarea:focus-visible,
        .flux-auth button:focus-visible,
        .flux-auth a:focus-visible {
            outline: 3px solid rgb(18 103 214 / 0.48);
            outline-offset: 3px;
        }

        .flux-auth footer {
            position: fixed;
            bottom: 0;
            color: #6e6e73;
            font-size: 0.8rem;
        }

        @media (max-width: 480px) {
            body.flux-auth {
                align-items: flex-start;
                padding-top: 1rem;
            }

            .flux-auth .box {
                margin: 0;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .flux-auth *,
            .flux-auth *::before,
            .flux-auth *::after {
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body class="flux-auth">
    {% block content %}{% endblock %}
    
    <footer>
        <p>&copy; {% now "Y" %} Flux</p>
    </footer>
</body>
</html>
