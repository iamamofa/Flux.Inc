{% load static %}
<!DOCTYPE html>
<html>

<head>
    <title>Flux: Done</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Montserrat', Arial, sans-serif;
            overflow: hidden;
            background-color: #f8f8f9;
            color: #2b303a;
        }
        
        .logo {
            margin-bottom: 2rem;
            max-width: 120px;
        }

        img {
            max-width: 100%;
            height: auto;
            max-height: 60vh;
            margin-bottom: 2rem;
        }

        .content {
            text-align: center;
            max-width: 500px;
            padding: 0 20px;
        }

        .button {
            display: inline-block;
            padding: 12px 25px;
            background-color: #ff5x00;
            border-radius: 4px;
            text-decoration: none;
            color: #fff !important;
            font-weight: 500;
            margin-top: 1.5rem;
            transition: background-color 0.3s ease;
        }

        .button:hover {
            background-color: #e05200;
        }

        p {
            margin: 0.5rem 0;
            padding: 0;
            font-size: 1.1rem;
        }

        footer {
            position: absolute;
            bottom: 0;
            width: 100%;
            text-align: center;
            padding: 15px;
            background-color: #f0f0f0;
            color: #555555;
            font-size: 0.9rem;
        }
        @media (prefers-color-scheme: dark) {
            body {
                background-color: #121212 !important;
                color: #e0e0e0 !important;
            }
            footer {
                background-color: #1e1e1e !important;
                color: #b0b0b0 !important;
            }
            .button {
                background-color: #ff7b4d !important;
            }
        }
    </style>
</head>

<body>
    <div class="content">
        <img src="{% static '/images/Done.png' %}"
             alt="Success"
             style="max-width: 100%; height: auto; max-height: 60vh; margin-bottom: 2rem;"
             width="400"
             height="300"
             loading="lazy">
        <p>{{ message1 }}</p>
        <p>{{ message2 }}</p>
        <a class="button" href="{% url 'home' %}">Log In</a>
    </div>
    <footer>
        <p>&copy; {% now "Y" %} Flux. All rights reserved.</p>
    </footer>
</body>
</html>
