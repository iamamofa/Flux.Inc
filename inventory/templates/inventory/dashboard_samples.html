{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Samples inventory dashboard">
    <link rel="icon" type="image/png" href="{% static '/images/Icon.png' %}">
    <link rel="stylesheet" href="{% static 'css/inventory_style.css' %}">
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <title>Flux - Samples Dashboard</title>
</head>

<body class="relative min-h-screen font-poppins antialiased text-sm bg-white flex text-gray-800 h-full 2xl:max-w-[1920px] 2xl:mx-auto 2xl:border-r-2"
    x-data="{ showMenu: false }">

    <aside class="flex flex-col lg:flex lg:flex-col justify-between shadow-xl lg:shadow-none lg:fixed min-h-screen top-0 z-20 bg-[#151e29] w-fit bottom-0 lg:w-60 px-3 lg:px-6 pt-6 pb-0"
        :class="showMenu ? 'fixed' : 'hidden'" x-transition.duration.500ms>
        <div>
            <a href="{% url 'home' %}" aria-label="Home">
                <div class="flex font-semibold text-lg items-center justify-center space-x-2">
                    <span>
                        <svg width="92" height="27" viewBox="0 0 92 27" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                            <path d="M5.38281 26H0.337891V0.792969H17.9863V5.83789H5.38281V10.8828H12.9414V15.9277H5.38281V26ZM38.2363 26H20.5879V0.792969H25.6328V20.9551H38.2363V26ZM59.875 15.9277C59.875 17.3223 59.6113 18.6348 59.084 19.8652C58.5566 21.084 57.8359 22.1504 56.9219 23.0645C56.0078 23.9668 54.9355 24.6816 53.7051 25.209C52.4863 25.7363 51.1797 26 49.7852 26C48.3906 26 47.0781 25.7363 45.8477 25.209C44.6289 24.6816 43.5625 23.9668 42.6484 23.0645C41.7461 22.1504 41.0312 21.084 40.5039 19.8652C39.9766 18.6348 39.7129 17.3223 39.7129 15.9277V0.792969H44.7402V15.9277C44.7402 16.6191 44.8691 17.2695 45.127 17.8789C45.3965 18.4883 45.7598 19.0215 46.2168 19.4785C46.6738 19.9355 47.207 20.2988 47.8164 20.5684C48.4375 20.8262 49.0938 20.9551 49.7852 20.9551C50.4766 20.9551 51.127 20.8262 51.7363 20.5684C52.3574 20.2988 52.8965 19.9355 53.3535 19.4785C53.8105 19.0215 54.168 18.4883 54.4258 17.8789C54.6953 17.2695 54.8301 16.6191 54.8301 15.9277V0.792969H59.875V15.9277ZM83.834 26H77.7168L72.8652 17.8613L67.9961 26H61.9141L69.6484 13.3965L61.9141 0.792969H67.9961L72.8652 8.93164L77.7168 0.792969H83.834L76.0996 13.3965L83.834 26Z" fill="#FF5C00"/>
                            <path d="M91.7344 23.207C91.7344 23.6289 91.6582 24.0273 91.5059 24.4023C91.3535 24.7656 91.1426 25.082 90.873 25.3516C90.6035 25.6211 90.2871 25.832 89.9238 25.9844C89.5605 26.1484 89.168 26.2305 88.7461 26.2305C88.3359 26.2305 87.9434 26.1484 87.5684 25.9844C87.2051 25.832 86.8828 25.6211 86.6016 25.3516C86.332 25.082 86.1152 24.7656 85.9512 24.4023C85.7988 24.0273 85.7227 23.6289 85.7227 23.207C85.7227 22.7969 85.7988 22.4102 85.9512 22.0469C86.1152 21.6836 86.332 21.3672 86.6016 21.0977C86.8828 20.8281 87.2051 20.6172 87.5684 20.4648C87.9434 20.3008 88.3359 20.2188 88.7461 20.2188C89.168 20.2188 89.5605 20.3008 89.9238 20.4648C90.2871 20.6172 90.6035 20.8281 90.873 21.0977C91.1426 21.3672 91.3535 21.6836 91.5059 22.0469C91.6582 22.4102 91.7344 22.7969 91.7344 23.207Z" fill="white"/>
                        </svg>      
                    </span>
                </div>
            </a>

            <div class="mt-12">
                <div class="flex flex-col space-y-2 text-base font-medium">
                    <!-- Dashboard menu items remain the same -->
                    <!-- ... -->
                </div>
            </div>
        </div>
        <div class="flex items-center justify-between bg-gray-800 text-white -mx-3 lg:-mx-6 px-6 lg:px-9 py-3 border-t-gray-500">
            <a href="{% url 'logout' %}" class="bg-primary border border-primary font-medium text-sm w-2/3 text-white tracking-wide py-2 rounded-md hover:bg-primary/90 text-center">
                Logout
            </a>
        </div>
    </aside>
    
    <main class="bg-white min-h-screen lg:ml-60 flex w-full">
        <!-- Screen Overlay -->
        <div class="absolute lg:hidden left-0 top-0 h-full w-full bg-black/30 z-[15]" 
             @click="showMenu = false"
             x-show="showMenu" 
             x-transition.opacity.duration.500ms>
        </div>

        <!-- Main Content -->
        <section class="flex-1 py-6 px-4 md:px-4 lg:px-8">
            <!-- Header -->
            <div class="flex items-center justify-between">
                <div>
                    <div class="text-gray-700 flex items-center justify-between mb-3">
                        <span>PROJECT</span>
                    </div>
                    <div class="dropdown">
                        <div class="project-name-container">
                            <span class="project-name-text text-gray-900 text-xl font-semibold">{{ project.name }}</span>
                            <svg class="dropdown-arrow" width="8" height="8" viewBox="0 0 8 8" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                                <!-- SVG content -->
                            </svg>
                        </div>    
                        <div class="dropdown-content">
                            {% for project in projects %}
                            <a href="{% url 'dashboard_consumables' project_name=project.name %}">{{ project.name }}</a>
                            {% endfor %}   
                        </div>
                    </div>
                </div>
                <div class="flex items-center space-x-4">
                    {% if user == project.project_manager %}
                    <button id="addItemBtn" onclick="showAddPopup()"
                        class="bg-primary hover:bg-primary/90 py-1.5 px-4 rounded flex items-center text-white space-x-1"
                        aria-label="Create new project">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6">
                            <path fill-rule="evenodd" d="M12 5.25a.75.75 0 01.75.75v5.25H18a.75.75 0 010 1.5h-5.25V18a.75.75 0 01-1.5 0v-5.25H6a.75.75 0 010-1.5h5.25V6a.75.75 0 01.75-.75z" clip-rule="evenodd" />
                        </svg>
                        <span>Create New Project</span>
                    </button>
                    {% endif %}
                    <button class="lg:hidden bg-gray-50 p-2 text-gray-600 rounded hover:bg-gray-300 focus:text-primary outline-none focus:drop-shadow"
                        @click="showMenu = !showMenu"
                        aria-label="Toggle menu">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-5 h-5">
                            <path fill-rule="evenodd" d="M2 4.75A.75.75 0 012.75 4h14.5a.75.75 0 010 1.5H2.75A.75.75 0 012 4.75zm7 10.5a.75.75 0 01.75-.75h7.5a.75.75 0 010 1.5h-7.5a.75.75 0 01-.75-.75zM2 10a.75.75 0 01.75-.75h14.5a.75.75 0 010 1.5H2.75A.75.75 0 012 10z" clip-rule="evenodd" />
                        </svg>
                    </button>
                </div>
            </div>
        
            <!-- Navigation differences -->
            <nav class="flex items-center mt-8 border-b space-x-10 text-gray-400 font-medium" aria-label="Dashboard navigation">
                <a href="{% url 'dashboard_consumables' project_name=project.name %}"
                    class="flex items-center space-x-1 pb-3 border-b-2 border-transparent hover:border-b-primary hover:text-gray-600">
                    <span>Consumables</span>
                </a>
                <a href="{% url 'dashboard_reagents' project_name=project.name %}"
                    class="flex items-center space-x-1 pb-3 border-b-2 border-transparent hover:border-b-primary hover:text-gray-600">
                    <span>Reagents</span>
                </a>
                <a href="{% url 'dashboard_equipment_' project_name=project.name %}"
                    class="flex items-center space-x-1 pb-3 border-b-2 border-transparent hover:border-b-primary hover:text-gray-600">
                    <span>Equipment</span>
                </a>
                <a href="{% url 'dashboard_samples' project_name=project.name %}"
                    class="flex items-center space-x-1 text-gray-600 border-b-2 border-b-primary pb-3">
                    <span>Samples</span>
                </a>
            </nav>
            <!-- Chart Container -->
            <div class="container mt-6">
                <div class="card plot-card">
                    <div class="card-body">
                        <div id="plotContainer" aria-live="polite">
                            <!-- Loading spinner -->
                            <div id="chartLoading" class="flex justify-center items-center py-12">
                                <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-primary"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
        <!-- Add Project Popup -->
        <div class="popup-container1" id="addPopup" style="display: none;">
            <div class="popup-card">
                <h2 class="text-xl font-semibold mb-4">Add Project</h2>
                <form id="add-form" method="POST" action="">
                    {% csrf_token %}
                    <div class="quantity-filter-container">
                        <label for="projectNameInput" class="block text-sm font-medium text-gray-700 mb-1">Name</label>
                        <input class="w-full bg-gray-200 py-1.5 px-2 outline-none text-gray-600 rounded mt-2" 
                               type="text" 
                               name="project_name" 
                               id="projectNameInput" 
                               required
                               aria-required="true"
                               onkeyup="this.setAttribute('value', this.value);" 
                               value="">
                    </div>
                    <div id="errorContainer" class="text-red-500 text-sm mt-2"></div>
                    <div class="mt-6 flex justify-center">
                        <button class="bg-primary border border-primary font-medium text-sm w-2/3 text-white tracking-wide py-2 rounded-md hover:bg-primary/90" 
                                type="submit">
                            OK
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <script>
            // Samples-specific chart initialization
            function initializeChart() {
                try {
                    const plotData = JSON.parse('{{ plot_data|escapejs }}');
                    const ids = plotData.ids || [];
                    const volumes = plotData.volumes || [];
                    
                    if (ids.length === 0 || volumes.length === 0) {
                        document.getElementById('plotContainer').innerHTML = '<p class="text-center py-8 text-gray-500">No samples data available</p>';
                        return;
                    }

                    const trace = {
                        x: ids,
                        y: volumes,
                        type: 'bar',
                        marker: { color: 'rgba(255, 92, 0, 1)' }
                    };
                    
                    const layout = {
                        title: 'Inventory by Sample',
                        xaxis: { title: 'Sample ID' },
                        yaxis: { title: 'Volume' },
                        responsive: true
                    };

                    document.getElementById('chartLoading').style.display = 'none';
                    Plotly.newPlot('plotContainer', [trace], layout);
                } catch (error) {
                    console.error('Error initializing samples chart:', error);
                    document.getElementById('plotContainer').innerHTML = '<p class="text-center py-8 text-gray-500">Error loading samples data</p>';
                }
            }

            document.addEventListener('DOMContentLoaded', function() {
                const modalContainer1 = document.querySelector(".popup-container1");
            
                modalContainer1.addEventListener("click", (event) => {
                    if (event.target === modalContainer1) {
                        closeAddPopup();
                    }
                });

                function showAddPopup() {
                    const popup = document.getElementById('addPopup');
                    popup.style.display = 'flex';
                    document.getElementById('projectNameInput').focus();
                }

                function closeAddPopup() {
                    const popup = document.getElementById('addPopup');
                    popup.style.display = 'none';
                    document.getElementById('errorContainer').textContent = '';
                }
            
                const form = document.getElementById('add-form');
                if (form) {
                    form.addEventListener('submit', async (event) => {
                        event.preventDefault();
                    
                        const formData = new FormData(form);
                        const inputValue = document.getElementById('projectNameInput').value.trim();
                        const errorContainer = document.getElementById('errorContainer');
                    
                        if (!inputValue) {
                            errorContainer.textContent = 'Project name is required';
                            return;
                        }

                        try {
                            const response = await fetch(`/create_project/`, {
                                method: 'PUT',
                                headers: {
                                    'X-CSRFToken': '{{ csrf_token }}',
                                    'Content-Type': 'application/json',
                                },
                                body: JSON.stringify({project_name: inputValue}),
                            });

                            if (response.ok) {
                                closeAddPopup();
                                window.location.href = `/dashboard/consumables/${encodeURIComponent(inputValue)}`;
                            } else {
                                const error = await response.text();
                                errorContainer.textContent = error || 'Kindly enter a unique project name';
                            }
                        } catch (error) {
                            console.error('Error creating project', error);
                            errorContainer.textContent = 'An error occurred. Please try again.';
                        }
                    });
                }

                // Initialize chart
                initializeChart();
            });
        </script>
    </main>
</body>
</html>
