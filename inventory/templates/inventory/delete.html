{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm Delete - Flux</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .popup-outer {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .popup-box {
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            width: 90%;
            max-width: 500px;
            padding: 30px;
            position: relative;
        }

        .profile-text {
            margin-bottom: 20px;
        }

        .profile-text .name {
            font-size: 1.5rem;
            font-weight: 500;
            color: #333;
        }

        .box {
            margin-top: 15px;
        }

        .box p {
            margin-bottom: 25px;
            color: #555;
            line-height: 1.5;
        }

        .button-container {
            display: flex;
            justify-content: flex-end;
            gap: 15px;
        }

        .confirm-btn, .cancel-btn {
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .confirm-btn {
            background-color: #dc3545;
            color: white;
            border: none;
        }

        .confirm-btn:hover {
            background-color: #c82333;
        }

        .cancel-btn {
            background-color: #6c757d;
            color: white;
            text-decoration: none;
            text-align: center;
            padding: 8px 16px;
        }

        .cancel-btn:hover {
            background-color: #5a6268;
        }

        .close {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 24px;
            color: #aaa;
            cursor: pointer;
        }

        .close:hover {
            color: #333;
        }
    </style>
</head>
<body>
    <!-- Popup box for delete confirmation -->
    <div id="deleteConfirmation" class="popup-outer" role="dialog" aria-modal="true" aria-labelledby="deleteConfirmationTitle">
        <div class="popup-box">
            <div class="profile-text">
                <div class="text">
                    <span class="name" id="deleteConfirmationTitle">Confirm Delete</span>
                </div>
            </div>
            <div class="box">
                <p>Are you sure you want to delete "{{item}}"?</p>
                <div class="button-container">
                    <form method="POST" action="{% url 'delete_consumable' item.id %}">
                        {% csrf_token %}
                        <button type="submit" class="confirm-btn">Confirm</button>
                    </form>
                    <a href="{% url 'consumables' %}" class="cancel-btn">Cancel</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
