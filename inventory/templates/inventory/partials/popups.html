{% load static %}
<!-- Base Popup Structure -->
<div class="popup-overlay" id="basePopup" style="display: none;">
    <div class="popup-container">
        <div class="popup-header">
            <h2 class="popup-title"></h2>
            <button class="popup-close" onclick="closePopup(this)">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6">
                    <path fill-rule="evenodd" d="M5.47 5.47a.75.75 0 011.06 0L12 10.94l5.47-5.47a.75.75 0 111.06 1.06L13.06 12l5.47 5.47a.75.75 0 11-1.06 1.06L12 13.06l-5.47 5.47a.75.75 0 01-1.06-1.06L10.94 12 5.47 6.53a.75.75 0 010-1.06z" clip-rule="evenodd" />
                </svg>
            </button>
        </div>
        <div class="popup-body">
            <!-- Content will be injected here -->
        </div>
    </div>
</div>

<!-- Add Item Popup (will be populated dynamically) -->
<div class="popup-overlay" id="addPopup" style="display: none;">
    <div class="popup-container">
        <div class="popup-header">
            <h2>Add <span class="item-type"></span></h2>
            <button class="popup-close" onclick="closePopup(this)">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6">
                    <path fill-rule="evenodd" d="M5.47 5.47a.75.75 0 011.06 0L12 10.94l5.47-5.47a.75.75 0 111.06 1.06L13.06 12l5.47 5.47a.75.75 0 11-1.06 1.06L12 13.06l-5.47 5.47a.75.75 0 01-1.06-1.06L10.94 12 5.47 6.53a.75.75 0 010-1.06z" clip-rule="evenodd" />
                </svg>
            </button>
        </div>
        <div class="popup-body">
            <form id="add-form" class="popup-form">
                <!-- Form fields will be injected here -->
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Add</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Edit Item Popup -->
<div class="popup-overlay" id="editPopup" style="display: none;">
    <div class="popup-container">
        <div class="popup-header">
            <h2>Edit <span class="item-type"></span></h2>
            <button class="popup-close" onclick="closePopup(this)">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6">
                    <path fill-rule="evenodd" d="M5.47 5.47a.75.75 0 011.06 0L12 10.94l5.47-5.47a.75.75 0 111.06 1.06L13.06 12l5.47 5.47a.75.75 0 11-1.06 1.06L12 13.06l-5.47 5.47a.75.75 0 01-1.06-1.06L10.94 12 5.47 6.53a.75.75 0 010-1.06z" clip-rule="evenodd" />
                </svg>
            </button>
        </div>
        <div class="popup-body">
            <form id="edit-form" class="popup-form">
                <!-- Form fields will be injected here -->
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Retrieve Item Popup -->
<div class="popup-overlay" id="retrievePopup" style="display: none;">
    <div class="popup-container">
        <div class="popup-header">
            <h2>Retrieve <span class="item-type"></span></h2>
            <button class="popup-close" onclick="closePopup(this)">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6">
                    <path fill-rule="evenodd" d="M5.47 5.47a.75.75 0 011.06 0L12 10.94l5.47-5.47a.75.75 0 111.06 1.06L13.06 12l5.47 5.47a.75.75 0 11-1.06 1.06L12 13.06l-5.47 5.47a.75.75 0 01-1.06-1.06L10.94 12 5.47 6.53a.75.75 0 010-1.06z" clip-rule="evenodd" />
                </svg>
            </button>
        </div>
        <div class="popup-body">
            <form id="retrieve-form" class="popup-form">
                <div class="form-group">
                    <label for="retrieve-by">Retrieve By</label>
                    <select id="retrieve-by" name="retrieve_by" class="form-control" required>
                        <option value="quantity">Quantity</option>
                        <option value="pack_size">Pack Size</option>
                        {% if item_type == 'sample' %}
                        <option value="volume">Volume</option>
                        {% endif %}
                    </select>
                </div>
                <div class="form-group">
                    <label for="retrieve-amount">Amount</label>
                    <input type="number" id="retrieve-amount" name="amount" class="form-control" required min="0" step="0.01">
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Retrieve</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Return Item Popup -->
<div class="popup-overlay" id="returnPopup" style="display: none;">
    <div class="popup-container">
        <div class="popup-header">
            <h2>Return <span class="item-type"></span></h2>
            <button class="popup-close" onclick="closePopup(this)">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6">
                    <path fill-rule="evenodd" d="M5.47 5.47a.75.75 0 011.06 0L12 10.94l5.47-5.47a.75.75 0 111.06 1.06L13.06 12l5.47 5.47a.75.75 0 11-1.06 1.06L12 13.06l-5.47 5.47a.75.75 0 01-1.06-1.06L10.94 12 5.47 6.53a.75.75 0 010-1.06z" clip-rule="evenodd" />
                </svg>
            </button>
        </div>
        <div class="popup-body">
            <form id="return-form" class="popup-form">
                <div class="form-group">
                    <label for="return-by">Return By</label>
                    <select id="return-by" name="return_by" class="form-control" required>
                        <option value="quantity">Quantity</option>
                        <option value="pack_size">Pack Size</option>
                        {% if item_type == 'sample' %}
                        <option value="volume">Volume</option>
                        {% endif %}
                    </select>
                </div>
                <div class="form-group">
                    <label for="return-amount">Amount</label>
                    <input type="number" id="return-amount" name="amount" class="form-control" required min="0" step="0.01">
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Return</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Delete Confirmation Popup -->
<div class="popup-overlay" id="deletePopup" style="display: none;">
    <div class="popup-container">
        <div class="popup-header">
            <h2>Confirm Deletion</h2>
            <button class="popup-close" onclick="closePopup(this)">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6">
                    <path fill-rule="evenodd" d="M5.47 5.47a.75.75 0 011.06 0L12 10.94l5.47-5.47a.75.75 0 111.06 1.06L13.06 12l5.47 5.47a.75.75 0 11-1.06 1.06L12 13.06l-5.47 5.47a.75.75 0 01-1.06-1.06L10.94 12 5.47 6.53a.75.75 0 010-1.06z" clip-rule="evenodd" />
                </svg>
            </button>
        </div>
        <div class="popup-body">
            <p>Are you sure you want to delete this item? This action cannot be undone.</p>
            <div class="form-actions">
                <button type="button" class="btn btn-secondary" onclick="closePopup(this.parentElement.parentElement.parentElement)">Cancel</button>
                <button type="button" class="btn btn-danger" onclick="deleteItem()">Delete</button>
            </div>
        </div>
    </div>
</div>

<!-- Loading Overlay -->
<div id="loading-overlay" class="loading-overlay" style="display: none;">
    <div class="loading-spinner">
        <svg class="animate-spin" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <span>Processing...</span>
    </div>
</div>

<!-- Notification System -->
<div id="notification-container" class="notification-container"></div>
