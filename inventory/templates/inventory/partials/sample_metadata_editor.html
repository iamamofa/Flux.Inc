<fieldset class="sample-metadata-editor" data-sample-metadata-editor>
    <legend>Sample metadata <span>Optional</span></legend>
    <p>Record the details your project needs, such as study ID, collection site or sample source. Use the same field names across samples for consistent exports.</p>
    <input type="hidden" name="metadata" value="{}">
    <div class="sample-metadata-rows" data-metadata-rows></div>
    <p class="sample-metadata-empty" data-metadata-empty>No custom fields added yet.</p>
    <button type="button" class="sample-metadata-add" data-metadata-add><span aria-hidden="true">+</span> Add metadata field</button>
    <p class="sample-metadata-error" data-metadata-error role="alert" hidden></p>
</fieldset>
