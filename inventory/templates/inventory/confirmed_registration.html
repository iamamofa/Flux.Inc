{% extends "inventory/base_auth.html" %}
{% load static %}

{% block title %}Information Uploaded{% endblock %}

{% block extra_css %}
<style>
    body {
        flex-direction: column;
        margin: 0;
        font-family: Arial, sans-serif;
        overflow: hidden;
    }
    img {
        max-width: 100%;
        height: auto;
        max-height: 70vh;
    }
    .button {
            display: inline-block;
            padding: 10px 20px;
            border: 2px solid #000;
            border-radius: 4px;
            text-decoration: none;
            color: #000;
            transition: background-color 0.3s ease;
        }

        .button:hover {
            background-color: #000;
            color: #fff;
        }

        p {
            margin: 0;
            /* Set the margin to 0 to remove spacing between paragraphs */
            padding: 0;
            /* Set the padding to 0 to remove spacing between paragraphs */
        }

        footer {
            background-color: #f9f9f9;
        }
</style>
{% endblock %}

{% block content %}
<div style="text-align: center; padding: 20px;">
    <img src="{% static 'images/Uploaded.png' %}" alt="Uploaded Image">
    <p>{{ message1 }}</p>
    <p>{{ message2 }}</p>
    <a href="{% url 'home' %}" class="button">Back to Home</a>
</div>
{% endblock %}
