{% if records.paginator.num_pages > 1 %}<nav class="pager" aria-label="Pagination"><span>Page {{ records.number }} of {{ records.paginator.num_pages }} · {{ records.paginator.count }} records</span><div>{% if records.has_previous %}<a class="button ghost" href="?page={{ records.previous_page_number }}{% if query %}&q={{ query|urlencode }}{% endif %}{% if request.GET.filter %}&filter={{ request.GET.filter|urlencode }}{% endif %}{% if status %}&status={{ status|urlencode }}{% endif %}">← Previous</a>{% endif %}{% if records.has_next %}<a class="button secondary" href="?page={{ records.next_page_number }}{% if query %}&q={{ query|urlencode }}{% endif %}{% if request.GET.filter %}&filter={{ request.GET.filter|urlencode }}{% endif %}{% if status %}&status={{ status|urlencode }}{% endif %}">Next →</a>{% endif %}</div></nav>{% endif %}
