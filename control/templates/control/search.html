{% extends 'control/base.html' %}{% block content %}<div class="page-head"><div><span class="eyebrow">GLOBAL SEARCH</span><h1>Search results</h1><p>Results are limited to records your account may access.</p></div></div><section class="panel"><form method="get" class="filterbar"><input class="field-control" aria-label="Search" name="q" placeholder="Search users, research projects, departments" value="{{ query }}"><button class="button primary">Search</button></form>{% for kind,name,url in results %}<a class="search-result" href="{{ url }}"><span class="tag">{{ kind }}</span><strong>{{ name }}</strong><span>→</span></a>{% empty %}<div class="empty-state">Enter a search term or try another query.</div>{% endfor %}</section>{% endblock %}
